name: CI

on:
  push:
    branches: [main]
  pull_request:

# Security: this workflow runs untrusted PR code, so it must only ever use
# GitHub-hosted runners — never the self-hosted (home PC) runner.
permissions:
  contents: read

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest pipeline/tests -q
