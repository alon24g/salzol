name: Pipeline (fetch → build → deploy)

on:
  schedule:
    - cron: "30 4,10,16 * * *" # 07:30 / 13:30 / 19:30 Israel (summer time)
  workflow_dispatch:

permissions:
  contents: read
  actions: read # download the Israel runner's artifact
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"

jobs:
  # Chains reachable from GitHub (docs/m0-reachability.md), fetched in parallel. Groups follow
  # the hosting portal so no portal gets more than one job's worth of concurrent downloads.
  # The geo-blocked chains come from fetch-israel.yml. Keep in sync with CHAINS in build.py.
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: shufersal
            chains: SHUFERSAL
          - group: cerberus-a
            chains: RAMI_LEVY,YOHANANOF,TIV_TAAM,OSHER_AD,POLIZER,STOP_MARKET
          - group: cerberus-b
            chains: SALACH_DABACH,FRESH_MARKET_AND_SUPER_DOSH,SUPER_YUDA,KESHET,YELLOW,DOR_ALON
          - group: bina
            chains: BAREKET,KING_STORE,MAAYAN_2000,MESHMAT_YOSEF_2,SHEFA_BARCART_ASHEM,SHUK_AHIR,SUPER_SAPIR,ZOL_VEBEGADOL,GOOD_PHARM,CITY_MARKET_KIRYATGAT
          - group: other
            chains: YAYNO_BITAN_AND_CARREFOUR,CITY_MARKET_SHOPS,NETIV_HASED
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch ${{ matrix.group }}
        run: python -m pipeline.fetch --out raw --chains "${{ matrix.chains }}" --kinds stores,price_full,promo_full
      - run: mv raw/fetch_status.json "raw/fetch_status-${{ matrix.group }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: raw-cloud-${{ matrix.group }}
          path: raw/
          retention-days: 3 # later runs reuse it if a chain's fetch fails (reuse-previous-raw.sh)
          if-no-files-found: warn

  build:
    needs: fetch
    if: ${{ !cancelled() }} # one failed fetch group must not stop the others from being published
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: raw-cloud-*
          path: raw
          merge-multiple: true

      - name: Keep last good data for chains whose fetch failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/reuse-previous-raw.sh raw "${{ github.run_id }}"

      - name: Add Israel runner data (if fresh)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Per chain, the newest successful fetch-israel run from the last 48h (spec §9) that
          # really has PriceFull files for it: a run just after midnight can legitimately find
          # nothing for a chain (laibcatalog lists only today's files), and one chain's portal
          # being down must not drop the others.
          runs=$(gh run list --workflow fetch-israel.yml --status success --limit 20 \
                  --json databaseId,createdAt \
                  --jq '.[] | select((now - (.createdAt | fromdateiso8601)) < 172800) | .databaseId')
          for run in $runs; do
            rm -rf raw-il
            gh run download "$run" --name raw-israel --dir raw-il 2>/dev/null || continue
            for dir in raw-il/*/; do
              chain=$(basename "$dir")
              [ -e "raw/$chain" ] && continue
              if [ -n "$(find "$dir" -path '*/price_full/*' -type f -print -quit)" ]; then
                cp -r "$dir" "raw/$chain"
                echo "Israel runner: $chain from run $run" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          done
          if [ -z "$runs" ]; then
            echo "::warning::No fetch-israel run from the last 48h; Israel-only chains will be missing"
          fi

      - name: Build data
        run: python -m pipeline.build --raw raw --out dist/data

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build site
        working-directory: web
        run: |
          npm ci
          npx vitest run
          npm run build
          cp -r ../dist/data dist/data

      - name: Summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("dist/data/meta.json", encoding="utf-8"))
          print("| chain | ok | stores | rows | updated |\n|---|---|---|---|---|")
          for c in m["chains"].values():
              print(f"| {c['slug']} | {'✅' if c['ok'] else '❌ ' + c.get('error', '')} | {c.get('stores', '')} | {c.get('rows', '')} | {c.get('updated', '')} |")
          print(f"\n{m['counts']}\n\n{m['sizes']}")
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
